name: CI for odfConverter

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: komperlan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run tests
        run: mvn test
  
  backend_build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
     
      - name: build backend
        run: |
          docker build -f backend/Dockerfile \
          -t ghcr.io/${{ env.IMAGE_OWNER }}/pdf-backend:${{ github.sha }} .
  
      - name: Push backend
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/pdf-backend:${{ github.sha }}

  frontend_build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build frontend
        run : |
          docker build -f frontend/Dockerfile \
          -t ghcr.io/${{env.IMAGE_OWNER}}//pdf-frontend:${{ github.sha }} ./frontend
      
      - name: push frontend
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER }}//pdf-frontend:${{ github.sha }}
        
 
  deploy:
    needs:
      - backend_build
      - frontend_build
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run : |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
          cd /pdfconverter &&
          export IMAGE_TAG="${{ github.sha }}" &&
          docker compose pull &&
          docker compose up -d --remove-orphans
          '