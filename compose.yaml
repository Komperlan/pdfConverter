name: docconverter

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docconverter}
      POSTGRES_USER: ${POSTGRES_USER:-docconverter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - docconverter-network

  carbone:
    image: carbone/carbone-ee:full-5.8.0
    restart: unless-stopped
    environment:
      CARBONE_EE_LICENSE: ${CARBONE_EE_LICENSE:-}
      CARBONE_EE_STUDIO: ${CARBONE_EE_STUDIO:-false}
      CARBONE_EE_FACTORIES: ${CARBONE_EE_FACTORIES:-1}
    healthcheck:
      test:
        - CMD-SHELL
        - grep -q ':0FA0 .* 0A ' /proc/net/tcp6
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - docconverter-network

  backend:
    image: ghcr.io/komperlan/pdf-backend:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-docconverter}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-docconverter}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
      CARBONE_BASE_URL: http://carbone:4000
      CARBONE_API_TOKEN: ${CARBONE_API_TOKEN:-}
      DOC_CONVERTER_STORAGE_ROOT: /app/storage
      CONVERSION_JOB_EXPIRATION: ${CONVERSION_JOB_EXPIRATION:-24h}
      CONVERSION_JOB_MAX_ATTEMPTS: ${CONVERSION_JOB_MAX_ATTEMPTS:-3}
      CONVERSION_WORKER_ENABLED: ${CONVERSION_WORKER_ENABLED:-true}
      CONVERSION_WORKER_MAX_PARALLELISM: ${CONVERSION_WORKER_MAX_PARALLELISM:-2}
      CONVERSION_RETRY_INITIAL_DELAY: ${CONVERSION_RETRY_INITIAL_DELAY:-5s}
      CONVERSION_RETRY_MAX_DELAY: ${CONVERSION_RETRY_MAX_DELAY:-1m}
      CONVERSION_RETRY_MULTIPLIER: ${CONVERSION_RETRY_MULTIPLIER:-2}
      CONVERSION_RECOVERY_ENABLED: ${CONVERSION_RECOVERY_ENABLED:-true}
      CONVERSION_RECOVERY_SCAN_INTERVAL: ${CONVERSION_RECOVERY_SCAN_INTERVAL:-30s}
      CONVERSION_RECOVERY_INITIAL_DELAY: ${CONVERSION_RECOVERY_INITIAL_DELAY:-30s}
      CONVERSION_RECOVERY_STALE_TIMEOUT: ${CONVERSION_RECOVERY_STALE_TIMEOUT:-2m}
      CONVERSION_RECOVERY_BATCH_SIZE: ${CONVERSION_RECOVERY_BATCH_SIZE:-100}
      CONVERSION_RETENTION_ENABLED: ${CONVERSION_RETENTION_ENABLED:-true}
      CONVERSION_RETENTION_CLEANUP_INTERVAL: ${CONVERSION_RETENTION_CLEANUP_INTERVAL:-1m}
      CONVERSION_RETENTION_INITIAL_DELAY: ${CONVERSION_RETENTION_INITIAL_DELAY:-30s}
      CONVERSION_RETENTION_BATCH_SIZE: ${CONVERSION_RETENTION_BATCH_SIZE:-100}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-storage:/app/storage
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      carbone:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/v3/api-docs
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 40s
    networks:
      - docconverter-network

  frontend:
    image: ghcr.io/komperlan/pdf-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - docconverter-network

volumes:
  postgres-data:
  backend-storage:

networks:
  docconverter-network:
    driver: bridge
